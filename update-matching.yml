name: update-matching

on:
  schedule:
    - cron: '30 20 * * *'   # 매일 05:30 (한국 시간)
    - cron: '30 8 * * *'    # 매일 17:30 (한국 시간)
  workflow_dispatch:
    inputs:
      feed_id:
        description: '매칭 글 번호 (비워 두면 새 글을 자동으로 찾습니다. 예: 84791)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for a new matching post
        run: node tools/update-matching.js
        env:
          FEED_ID: ${{ github.event.inputs.feed_id }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matching.json tools/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update matching data"
            git push
          fi
